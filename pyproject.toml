[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mle"
version = "0.0.1"
description = "pipeline mle"
authors = [
  { name = "Sahil" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.14.2"


[tool.ruff]
line-length = 99
src = ["mle"]
include = ["pyproject.toml", "mle/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mle"]
force-sort-within-sections = true

